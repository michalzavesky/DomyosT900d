<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intervaly — ovládání pásu</title>
<style>
  :root{
    --bg: #12161B;
    --panel: #1A2027;
    --panel-2: #1F262E;
    --line: #2B333C;
    --text: #EDEBE2;
    --text-dim: #8A93A0;
    --red: #E1432E;
    --green: #4FA35A;
    --amber: #E0A83C;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:20px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  h1{
    font-size:19px;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  h1 small{display:block;font-size:12px;font-weight:400;color:var(--text-dim);margin-top:2px;}

  .status{
    display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--text-dim);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);flex:none;}
  .dot.on{background:var(--green);box-shadow:0 0 8px var(--green);}
  .dot.err{background:var(--red);box-shadow:0 0 8px var(--red);}

  button{
    font-family:inherit;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    padding:10px 16px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  button:hover{border-color:#3A4550;}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:0.35;cursor:not-allowed;}
  button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600;}
  button.primary:hover{background:#c93b28;}
  button.ghost{background:transparent;}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-bottom:16px;
  }

  /* --- Live run panel --- */
  .run-panel{text-align:center;padding:26px 20px;}
  .run-label{
    font-size:13px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:0.08em;
    margin-bottom:6px;
  }
  .run-name{font-size:22px;font-weight:600;margin-bottom:18px;}
  .run-name.rest{color:var(--amber);}
  .run-name.work{color:var(--red);}

  .big-numbers{
    display:flex;justify-content:center;gap:36px;
    margin-bottom:20px;flex-wrap:wrap;
  }
  .big-numbers .item{min-width:110px;}
  .big-numbers .value{
    font-family:var(--mono);
    font-size:40px;font-weight:600;
    line-height:1;
  }
  .big-numbers .unit{font-size:13px;color:var(--text-dim);margin-top:6px;}

  .progress-outer{
    height:10px;background:var(--panel-2);
    border-radius:6px;overflow:hidden;margin-bottom:20px;
    border:1px solid var(--line);
  }
  .progress-inner{
    height:100%;background:var(--red);
    width:0%;transition:width .3s linear;
  }
  .progress-inner.rest{background:var(--amber);}

  .run-controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
  .run-controls button{min-width:100px;font-size:15px;padding:12px 18px;}

  .idle-msg{color:var(--text-dim);font-size:14px;line-height:1.5;}

  /* --- Interval table --- */
  .section-title{
    font-size:13px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:0.08em;
